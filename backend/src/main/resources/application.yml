server:
  port: 8080

spring:
  application:
    name: ai-pixel-studio-server
  servlet:
    multipart:
      # Source images can be several megabytes; AI processing limits will be added in a later phase.
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/ai_pixel_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # Use a 32+ character high-entropy secret in production via JWT_SECRET or external config.
  secret: ${JWT_SECRET:change-this-development-secret-key-to-a-strong-32-byte-value}
  expiration: 604800000
